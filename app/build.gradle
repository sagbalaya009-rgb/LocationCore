plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.locationcore'
    compileSdk 37

    defaultConfig {
        applicationId 'dev.locationcore'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.2.0-alpha'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':engine')
}

